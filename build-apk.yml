name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE" || { echo 'ZIP not found'; exit 1; }
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          cd project
          PROJECT_DIR=$(find . -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR" || { echo 'Gradle project not found'; exit 1; }
          cd "$PROJECT_DIR"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          /tmp/gradle-9.3.1/bin/gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/output/"

      - uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: output/*.apk
